apiVersion: apps/v1
kind: Deployment
metadata:
  name: fscart
  namespace: fscart-staging
spec:
  replicas: 2
  template:
    spec:
      containers:
        - name: fscart
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          env:
            - name: ENV
              value: staging
            - name: LOG_LEVEL
              value: info
