apiVersion: apps/v1
kind: Deployment
metadata:
  name: fscart
  namespace: fscart-prod
spec:
  replicas: 3
  template:
    spec:
      containers:
        - name: fscart
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          env:
            - name: ENV
              value: production
            - name: LOG_LEVEL
              value: warn
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - fscart
              topologyKey: kubernetes.io/hostname
