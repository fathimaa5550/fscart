name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  IMAGE_NAME: fathimasalam/fscart

jobs:
  # ──────────────────────────────────────────
  # Job 1: Validate Kubernetes manifests
  # ──────────────────────────────────────────
  validate-k8s:
    name: Validate Kubernetes manifests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install kubectl
        uses: azure/setup-kubectl@v4
        with:
          version: "v1.30.0"

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.1 /usr/local/bin
          kustomize version

      - name: Build & dry-run overlay — dev
        run: |
          echo "==> Building dev overlay..."
          kustomize build k8s/overlays/dev | tee /tmp/k8s-dev.yaml
          echo "==> Dry-running dev manifests..."
          kubectl apply --dry-run=client -f /tmp/k8s-dev.yaml

      - name: Build & dry-run overlay — staging
        run: |
          echo "==> Building staging overlay..."
          kustomize build k8s/overlays/staging | tee /tmp/k8s-staging.yaml
          echo "==> Dry-running staging manifests..."
          kubectl apply --dry-run=client -f /tmp/k8s-staging.yaml

      - name: Build & dry-run overlay — prod
        run: |
          echo "==> Building prod overlay..."
          kustomize build k8s/overlays/prod | tee /tmp/k8s-prod.yaml
          echo "==> Dry-running prod manifests..."
          kubectl apply --dry-run=client -f /tmp/k8s-prod.yaml

      - name: Upload rendered manifests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rendered-k8s-manifests
          path: /tmp/k8s-*.yaml
          retention-days: 7

  # ──────────────────────────────────────────
  # Job 2: Container security scan (Trivy)
  # ──────────────────────────────────────────
  security-scan:
    name: Security scan (Trivy)
    runs-on: ubuntu-latest

    permissions:
      contents: read
      security-events: write  # needed to upload SARIF results

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image for scanning
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}"
          format: "sarif"
          output: "trivy-results.sarif"
          severity: "HIGH,CRITICAL"
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF results to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: "trivy-results.sarif"

      - name: Run Trivy scan (table output for PR summary)
        if: always()
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: "${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}"
          format: "table"
          severity: "HIGH,CRITICAL"
          ignore-unfixed: true
          exit-code: "0"

  # ──────────────────────────────────────────
  # Job 3: Lint Terraform code
  # ──────────────────────────────────────────
  lint-terraform:
    name: Lint Terraform
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Terraform format check
        id: fmt
        run: terraform fmt -check -recursive -diff
        continue-on-error: false

      - name: Terraform init (for validate)
        run: |
          terraform init -backend=false -input=false

      - name: Terraform validate
        id: validate
        run: terraform validate -no-color

      - name: Post Terraform results to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fmt    = '${{ steps.fmt.outcome }}';
            const valid  = '${{ steps.validate.outcome }}';
            const icon   = (s) => s === 'success' ? '✅' : '❌';
            const body   = [
              '## Terraform Checks',
              '',
              `| Check | Result |`,
              `|-------|--------|`,
              `| \`terraform fmt\` | ${icon(fmt)} ${fmt} |`,
              `| \`terraform validate\` | ${icon(valid)} ${valid} |`,
            ].join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
