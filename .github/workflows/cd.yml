name: CD

on:
  workflow_run:
    workflows:
      - CI
    branches:
      - main
    types:
      - completed

concurrency:
  group: ${{ github.workflow }}-deploy
  cancel-in-progress: false

env:
  IMAGE_NAME: fathimasalam/fscart

jobs:
  # ──────────────────────────────────────────
  # Job 1: Update image tag in GitOps repo
  # ──────────────────────────────────────────
  update-image-tag:
    name: Update Kubernetes image tags
    runs-on: ubuntu-latest
    # Only run when CI completed successfully
    if: ${{ github.event.workflow_run.conclusion == 'success' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use PAT so the git push triggers subsequent workflows
          token: ${{ secrets.GH_PAT }}
          fetch-depth: 0

      - name: Compute short SHA
        run: |
          echo "SHORT_SHA=$(echo ${{ github.event.workflow_run.head_sha }} | cut -c1-7)" >> $GITHUB_ENV
          echo "FULL_SHA=${{ github.event.workflow_run.head_sha }}" >> $GITHUB_ENV

      - name: Install kustomize
        run: |
          curl -sL "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" \
            | bash -s -- 5.4.1 /usr/local/bin
          kustomize version

      - name: Update prod image tag
        working-directory: k8s/overlays/prod
        run: |
          kustomize edit set image \
            REGISTRY/fscart=fathimasalam/fscart:${{ env.FULL_SHA }}

      - name: Update staging image tag
        working-directory: k8s/overlays/staging
        run: |
          kustomize edit set image \
            REGISTRY/fscart=fathimasalam/fscart:${{ env.SHORT_SHA }}

      - name: Commit and push updated manifests
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/prod/kustomization.yaml \
                  k8s/overlays/staging/kustomization.yaml
          git commit -m "ci: update image to ${{ env.FULL_SHA }} [skip ci]"
          git push

  # ──────────────────────────────────────────
  # Job 2: Notify ArgoCD & sync staging
  # ──────────────────────────────────────────
  notify-argocd:
    name: Sync staging via ArgoCD
    runs-on: ubuntu-latest
    needs: update-image-tag

    steps:
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o /usr/local/bin/argocd \
            "https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64"
          chmod +x /usr/local/bin/argocd
          argocd version --client

      - name: Login to ArgoCD
        run: |
          argocd login "${{ secrets.ARGOCD_SERVER }}" \
            --username "${{ secrets.ARGOCD_USERNAME }}" \
            --password "${{ secrets.ARGOCD_PASSWORD }}" \
            --insecure \
            --grpc-web

      - name: Sync fscart-staging
        run: |
          argocd app sync fscart-staging --timeout 120 --grpc-web

      - name: Wait for fscart-staging to be healthy
        run: |
          argocd app wait fscart-staging \
            --health \
            --timeout 180 \
            --grpc-web

      - name: Report staging status
        run: |
          argocd app get fscart-staging --output wide --grpc-web

      - name: Production deployment instructions
        run: |
          echo "============================================================"
          echo "  ✅  Staging deployment complete."
          echo ""
          echo "  ⚠️   Production sync is MANUAL and requires approval."
          echo "  Run the following to promote to production:"
          echo ""
          echo "    argocd app sync fscart-prod --timeout 300"
          echo "    argocd app wait fscart-prod --health --timeout 600"
          echo ""
          echo "  Or open the ArgoCD UI and sync 'fscart-prod' manually."
          echo "============================================================"

      - name: Write summary
        run: |
          echo "### CD Pipeline Summary 🚀" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Staging** | ✅ Synced & Healthy |" >> $GITHUB_STEP_SUMMARY
          echo "| **Production** | ⏳ Manual sync required |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.IMAGE_NAME }}:${{ github.event.workflow_run.head_sha }}\`" >> $GITHUB_STEP_SUMMARY
