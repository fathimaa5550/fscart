name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment to destroy"
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod

      confirmation:
        description: >
          Type DESTROY to confirm you want to permanently destroy the
          selected environment. This action is irreversible.
        required: true
        type: string

      reason:
        description: "Reason for destroying this environment (audit trail)"
        required: true
        type: string

# No concurrency guard — we want destroys to be serialised per environment.
concurrency:
  group: terraform-destroy-${{ github.event.inputs.environment }}
  cancel-in-progress: false

env:
  TF_INPUT: false
  TF_IN_AUTOMATION: true

jobs:
  # ──────────────────────────────────────────
  # Preflight: validate the confirmation input
  # ──────────────────────────────────────────
  preflight:
    name: Preflight — validate confirmation
    runs-on: ubuntu-latest

    steps:
      - name: Check confirmation token
        run: |
          if [ "${{ github.event.inputs.confirmation }}" != "DESTROY" ]; then
            echo "::error::Confirmation input must be exactly 'DESTROY'. Got: '${{ github.event.inputs.confirmation }}'"
            exit 1
          fi
          echo "✅  Confirmation accepted. Proceeding with destroy of '${{ github.event.inputs.environment }}'."

      - name: Extra guard for production
        if: github.event.inputs.environment == 'prod'
        run: |
          echo "::warning::You are about to destroy the PRODUCTION environment!"
          echo "Triggered by: ${{ github.actor }}"
          echo "Reason:       ${{ github.event.inputs.reason }}"

  # ──────────────────────────────────────────
  # Terraform destroy
  # ──────────────────────────────────────────
  destroy:
    name: Terraform destroy — ${{ github.event.inputs.environment }}
    runs-on: ubuntu-latest
    needs: preflight

    # Use a GitHub Environment so destroy jobs can require manual approval
    # via branch protection / environment protection rules.
    environment: ${{ github.event.inputs.environment }}

    defaults:
      run:
        working-directory: terraform/

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id:     ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region:            ${{ secrets.AWS_REGION }}

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="key=${{ github.event.inputs.environment }}/terraform.tfstate" \
            -reconfigure \
            -input=false

      - name: Select / create Terraform workspace
        run: |
          terraform workspace select "${{ github.event.inputs.environment }}" \
            || terraform workspace new "${{ github.event.inputs.environment }}"

      - name: Generate destroy plan
        id: plan
        run: |
          terraform plan \
            -destroy \
            -var="environment=${{ github.event.inputs.environment }}" \
            -out=destroy.tfplan \
            -input=false \
            -no-color 2>&1 | tee plan.txt

      - name: Upload destroy plan
        uses: actions/upload-artifact@v4
        with:
          name: destroy-plan-${{ github.event.inputs.environment }}-${{ github.run_id }}
          path: terraform/destroy.tfplan
          retention-days: 30

      - name: Apply terraform destroy
        run: |
          terraform apply \
            -auto-approve \
            -input=false \
            destroy.tfplan

      - name: Write job summary
        if: always()
        run: |
          echo "### Terraform Destroy — ${{ github.event.inputs.environment }} 💥" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| **Environment** | \`${{ github.event.inputs.environment }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Triggered by** | \`${{ github.actor }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Run ID** | \`${{ github.run_id }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| **Reason** | ${{ github.event.inputs.reason }} |" >> $GITHUB_STEP_SUMMARY
          echo "| **Status** | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY

  # ──────────────────────────────────────────
  # Post-destroy notification
  # ──────────────────────────────────────────
  notify:
    name: Notify on completion
    runs-on: ubuntu-latest
    needs: destroy
    if: always()

    steps:
      - name: Notify success
        if: needs.destroy.result == 'success'
        run: |
          echo "✅  Destroy of '${{ github.event.inputs.environment }}' completed successfully."
          echo "Actor:  ${{ github.actor }}"
          echo "Reason: ${{ github.event.inputs.reason }}"
          echo "Run:    ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Notify failure
        if: needs.destroy.result != 'success'
        run: |
          echo "::error::Destroy of '${{ github.event.inputs.environment }}' FAILED."
          echo "Check the run at: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          exit 1
