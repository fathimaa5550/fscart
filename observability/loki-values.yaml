# =============================================================================
# fscart – Loki Helm Values (grafana/loki v6.x – single-binary mode)
# =============================================================================

# ----------------------------------------------------------------------------
# Global
# ----------------------------------------------------------------------------
global:
  image:
    registry: docker.io

# ----------------------------------------------------------------------------
# Deployment mode – single binary (monolithic) for simplicity
# Switch to "distributed" or "simple-scalable" for production scale-out
# ----------------------------------------------------------------------------
deploymentMode: SingleBinary

# ----------------------------------------------------------------------------
# Loki core configuration
# ----------------------------------------------------------------------------
loki:
  auth_enabled: false   # No multi-tenancy; all logs go to the default tenant

  commonConfig:
    replication_factor: 1

  # Schema – use TSDB index (recommended for Loki ≥ 2.9)
  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  # Storage – filesystem (suitable for single-node / dev / staging)
  storage:
    type: filesystem

  # Compactor – enforces retention
  compactor:
    working_directory: /var/loki/compactor
    retention_enabled: true
    retention_delete_delay: 2h
    retention_delete_worker_count: 150

  # Limits – ingestion and query
  limits_config:
    # Ingestion
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 32
    per_stream_rate_limit: "5MB"
    per_stream_rate_limit_burst: "20MB"
    max_streams_per_user: 10000
    max_line_size: 256KB

    # Retention (7 days = 168 hours)
    retention_period: 168h

    # Query
    max_query_series: 500
    max_query_parallelism: 32
    max_entries_limit_per_query: 5000
    max_query_length: 721h    # slightly more than 30 days to allow admin queries
    split_queries_by_interval: 24h

    # Cardinality
    max_label_names_per_series: 30
    max_label_value_length: 4096

  # Query range
  query_range:
    results_cache:
      cache:
        embedded_cache:
          enabled: true
          max_size_mb: 100

  # Ruler (alerting rules)
  ruler:
    storage:
      type: local
      local:
        directory: /var/loki/rules
    rule_path: /var/loki/rules-temp
    ring:
      kvstore:
        store: inmemory
    enable_api: true

  # Server
  server:
    http_listen_port: 3100
    grpc_listen_port: 9095
    log_level: info

# ----------------------------------------------------------------------------
# Single-binary deployment
# ----------------------------------------------------------------------------
singleBinary:
  replicas: 1

  resources:
    limits:
      cpu: "1"
      memory: 1Gi
    requests:
      cpu: 250m
      memory: 512Mi

  persistence:
    enabled: true
    storageClass: ""      # cluster default
    accessModes:
      - ReadWriteOnce
    size: 20Gi

  extraEnv:
    - name: GOGC
      value: "100"

  tolerations: []
  affinity: {}

# ----------------------------------------------------------------------------
# Disable non-single-binary components
# ----------------------------------------------------------------------------
read:
  replicas: 0

write:
  replicas: 0

backend:
  replicas: 0

# ----------------------------------------------------------------------------
# Chunk cache (built-in)
# ----------------------------------------------------------------------------
chunksCache:
  enabled: false   # use embedded cache for single-binary simplicity

resultsCache:
  enabled: false

# ----------------------------------------------------------------------------
# Minio (disable – we use filesystem)
# ----------------------------------------------------------------------------
minio:
  enabled: false

# ----------------------------------------------------------------------------
# Monitoring self-metrics
# ----------------------------------------------------------------------------
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false

  lokiCanary:
    enabled: false

  serviceMonitor:
    enabled: true
    labels:
      release: prometheus    # matches kube-prometheus-stack selector

  dashboards:
    enabled: true
    labels:
      grafana_dashboard: "1"

# ----------------------------------------------------------------------------
# Promtail (bundled; we deploy Promtail separately via its own Helm chart)
# ----------------------------------------------------------------------------
promtail:
  enabled: false

# ----------------------------------------------------------------------------
# Gateway (nginx proxy; disabled – expose via ClusterIP only)
# ----------------------------------------------------------------------------
gateway:
  enabled: false

# ----------------------------------------------------------------------------
# Service
# ----------------------------------------------------------------------------
service:
  type: ClusterIP
  port: 3100
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "3100"
