apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fscart-dev
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: fscart-dev
    app.kubernetes.io/part-of: fscart
    app.kubernetes.io/managed-by: argocd
    environment: dev
  annotations:
    argocd.argoproj.io/description: "FsCart development environment — continuous deployment from HEAD"
spec:
  project: fscart

  source:
    repoURL: https://github.com/fathimaa5550/fscart
    targetRevision: HEAD
    path: k8s/overlays/dev

  destination:
    server: https://kubernetes.default.svc
    namespace: fscart-dev

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 1m

  # Ignore differences on HPA fields that are managed by the cluster autoscaler
  # (current replica counts fluctuate and should not trigger out-of-sync)
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jqPathExpressions:
        - .spec.metrics[].resource.target.averageUtilization
    # Also ignore deployment replica count when HPA is managing it
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
