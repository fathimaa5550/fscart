apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fscart-staging
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
  labels:
    app.kubernetes.io/name: fscart-staging
    app.kubernetes.io/part-of: fscart
    app.kubernetes.io/managed-by: argocd
    environment: staging
  annotations:
    argocd.argoproj.io/description: "FsCart staging environment — mirrors production configuration for pre-release validation"
spec:
  project: fscart

  source:
    repoURL: https://github.com/fathimaa5550/fscart
    targetRevision: HEAD
    path: k8s/overlays/staging

  destination:
    server: https://kubernetes.default.svc
    namespace: fscart-staging

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
      allowEmpty: false
    syncOptions:
      - Validate=true
      - CreateNamespace=true
      - PrunePropagationPolicy=foreground
      - PruneLast=true
      - ApplyOutOfSyncOnly=true
    retry:
      limit: 3
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 2m

  # Ignore HPA-managed fields to prevent flapping in sync status
  ignoreDifferences:
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jsonPointers:
        - /spec/minReplicas
        - /spec/maxReplicas
    - group: autoscaling
      kind: HorizontalPodAutoscaler
      jqPathExpressions:
        - .spec.metrics[].resource.target.averageUtilization
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
